# 双仓部署：内容仓推送 -> 本仓库重新构建 -> 部署到 GitHub Pages。
# 由 deploy.yml.example 启用，部署步骤采用「变体 B：GitHub Pages」。
#
# 前置条件：
#   1. 仓库 Settings > Pages > Source 选择 "GitHub Actions"；
#   2. 配置 secrets.CONTENT_REPO_TOKEN：能读取私有内容仓的 PAT；
#   3. 内容仓的 trigger-build.yml 已指向本仓库，并配置 secrets.DISPATCH_TOKEN。

name: Deploy

on:
  # 代码变更。
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "rules/**"
      - "README*.md"
      - "*.md"
  # 内容仓推送后由 trigger-build.yml 发来的事件。
  repository_dispatch:
    types: [content-updated]
  # 手动触发；回滚时把 content_ref 填成旧的内容 SHA。
  workflow_dispatch:
    inputs:
      content_ref:
        description: "内容仓 ref 或 commit SHA（留空使用 main）"
        required: false
        default: ""
  # 兜底：repository_dispatch 事件偶尔会丢，每天重建一次保证最终一致。
  schedule:
    - cron: "17 4 * * *"

# 并发控制：同一时间只允许一个部署流水线运行。
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  CONTENT_REPOSITORY: Chinatsuway/shirone-content
  CONTENT_WORKING_COPY: .content-src

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CI: true
      # 让 content:sync 走「本地目录」模式，内容由下面的 checkout 步骤取得。
      CONTENT_DIR: .content-src

    steps:
      - name: Resolve content ref
        id: target
        # 经 env 传递而不是直接内插到脚本里：client_payload 属于外部输入，
        # 直接内插会形成 shell 注入面。
        env:
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          INPUT_REF: ${{ github.event.inputs.content_ref }}
        run: |
          set -euo pipefail
          ref="${PAYLOAD_SHA:-}"
          [ -n "$ref" ] || ref="${INPUT_REF:-}"
          [ -n "$ref" ] || ref="main"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout theme
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout content
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.CONTENT_REPOSITORY }}
          ref: ${{ steps.target.outputs.ref }}
          path: ${{ env.CONTENT_WORKING_COPY }}
          # 内容仓为私有，需要 PAT。
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          persist-credentials: false

      - name: Record content commit
        id: content
        run: |
          set -euo pipefail
          echo "sha=$(git -C '${{ env.CONTENT_WORKING_COPY }}' rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.14.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore build caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # 缩略图按源图内容哈希复用，因此跨 commit 的缓存命中是有效的。
          path: |
            .astro
            node_modules/.astro
            public/assets/moments/thumbnails
          key: ${{ runner.os }}-shirone-${{ hashFiles('pnpm-lock.yaml', 'astro.config.mjs') }}-${{ steps.content.outputs.sha }}
          restore-keys: |
            ${{ runner.os }}-shirone-${{ hashFiles('pnpm-lock.yaml', 'astro.config.mjs') }}-
            ${{ runner.os }}-shirone-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # 独立成步，而不是依赖 `pnpm build` 内部再跑一次：
      # 内容问题（含 config/*.yaml 的类型校验）与构建问题因此在日志里天然分开，
      # 且 fonts:subset 需要内容与配置都已就位。
      - name: Materialize content and config
        run: pnpm content:sync

      - name: Build site
        run: pnpm build
        env:
          # 按需补齐可选功能的凭据。
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Summarize
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Shirone deploy"
            echo ""
            echo "- 内容仓：\`${CONTENT_REPOSITORY}\`"
            echo "- 内容 ref：\`${{ steps.target.outputs.ref }\`"
            echo "- 内容 commit：\`${{ steps.content.outputs.sha }}\`"
            if [ -f content.lock.json ]; then
              echo ""
              echo "<details><summary>content.lock.json</summary>"
              echo ""
              echo '```json'
              cat content.lock.json
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
